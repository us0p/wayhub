# Quality gates (D32). Deploy workflow is added in Milestone 10.
# Security notes (D37):
# - Third-party actions are pinned to full commit SHAs (tags are mutable).
# - GITHUB_TOKEN is read-only and checkout does not persist it.
# - The CI Postgres is a throwaway service container reachable only from this runner;
#   it uses trust auth so no credential exists in this file at all.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.11"
  TAILWIND_VERSION: "v4.1.4"
  TAILWIND_SHA256: "0fa8bbb8beca7242f6455bf01bbe35d3083878f6308ec4a4cec30aed16bca46d"
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
  # Test-only values for the ephemeral CI database (no password: trust auth, see header).
  APP_ENV: test
  DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/mentor_test

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (full history, checksum-verified binary)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLfo "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose --exit-code 1

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: mentor_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - name: Generate per-run SECRET_KEY
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run alembic check  # models and migrations must not drift
      - run: uv run pytest

  e2e:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: mentor_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - name: Generate per-run SECRET_KEY
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - name: Build CSS (Tailwind standalone, checksum-verified)
        run: |
          curl -sSLfo tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          echo "${TAILWIND_SHA256}  tailwindcss" | sha256sum --check --strict
          chmod +x tailwindcss
          ./tailwindcss -i src/mentor/web/static/css/input.css -o src/mentor/web/static/css/app.css --minify
      - run: uv run playwright install --with-deps chromium
      - run: uv run alembic upgrade head
      - name: Start server
        run: |
          uv run uvicorn --factory mentor.main:create_app --port 8000 &
          timeout 30 bash -c 'until curl -sf localhost:8000/health; do sleep 1; done'
      - run: uv run pytest -m e2e --base-url http://localhost:8000 -p no:cacheprovider tests/e2e

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

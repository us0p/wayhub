{% from "components/chat.html" import composer %}
<article id="pending-{{ turn.id }}" hx-swap-oob="outerHTML:#pending-{{ turn.id }}" role="alert"
         class="mr-auto max-w-[85%] rounded-3xl rounded-bl-lg bg-cream px-4 py-3 text-sm md:max-w-[75%]">
  {% if retryable %}
  <p class="text-danger">{{ _("Não consegui responder agora.") }}</p>
  <button hx-get="/entrevista/turnos/{{ turn.id }}/pendente" hx-target="closest article" hx-swap="outerHTML"
          class="mt-2 rounded-full bg-sage px-4 py-2 text-xs font-semibold text-ink">{{ _("Tentar de novo") }}</button>
  {% else %}
  <p class="text-danger">{{ _("Não consegui responder a essa mensagem. Por favor, envie de novo.") }}</p>
  {% endif %}
</article>
{% if not retryable %}{{ composer(oob=True) }}{% endif %}

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f2f2f">
  <title>{% block title %}Mentor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  {# htmx config: no inline <style> injection, so the CSP needs no 'unsafe-inline' for styles #}
  {# 409/429 responses carry a user-facing message partial, so htmx swaps them too. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "409|429", "swap": true, "error": false}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
          crossorigin="anonymous" defer></script>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  {% from "components/nav.html" import bottom_nav, top_nav %}
  {# Mobile-first (D38): phone layout by default, widened at md+ with the dock moved to the top. #}
  {% block top_nav %}{{ top_nav(active_nav|default("")) }}{% endblock %}
  {% block main %}
  <div class="min-h-dvh bg-surface md:bg-canvas">
    <main class="mx-auto w-full max-w-md px-5 pb-28 pt-8 md:max-w-6xl md:px-8 md:pb-16 md:pt-10">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% endblock %}
  {# Confirmation modal (replaces the browser's confirm()); driven by static/js/app.js. #}
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"
          class="m-auto w-[calc(100%-2.5rem)] max-w-sm rounded-[var(--radius-card)] bg-surface p-6 text-ink shadow-xl backdrop:bg-ink/50">
    <h2 id="confirm-title" class="text-lg font-semibold">{{ _("Tem certeza?") }}</h2>
    <p data-confirm-message class="mt-2 text-sm leading-relaxed text-taupe-strong"></p>
    <div class="mt-6 flex flex-wrap justify-end gap-3">
      <button type="button" data-confirm-no class="rounded-full border border-moss px-5 py-2.5 text-sm font-semibold">{{ _("Cancelar") }}</button>
      <button type="button" data-confirm-yes class="rounded-full bg-danger px-5 py-2.5 text-sm font-semibold text-white shadow">{{ _("Excluir") }}</button>
    </div>
  </dialog>
  {% block bottom_nav %}{{ bottom_nav(active_nav|default("")) }}{% endblock %}
</body>
</html>
